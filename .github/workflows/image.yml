# يبني صورة الموقع في GitHub (لا على الخادم ولا بدقائق Render) ويدفعها إلى
# GHCR، ثم — إن فُعِّل — ينشرها على الخادم الخاص بسحب الصورة فقط.
#
# النشر الآلي معطّل حتى تُضبط في إعدادات المستودع (deploy/vps/setup-auto-deploy.sh يضبطها):
#   Variables: VPS_DEPLOY=true
#   Secrets:   VPS_SSH_KEY (مفتاح نشر مقيّد بأمر واحد)، VPS_KNOWN_HOSTS
# المفتاح على الخادم لا يشغّل إلا /usr/local/bin/stingdev-deploy: نرسل له sha
# الالتزام فقط، فينشر الصورة المبنية منه بالضبط ويتحقق من صحتها.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/stingcompiler/nex-systems-portfolio-os

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # طبقات pip وnpm لا تُعاد إلا إن تغيّرت ملفات المتطلبات
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.VPS_DEPLOY == 'true'
    # البناء يُلغى عند دمج أحدث، أما النشر الجاري فلا يُقطع في منتصفه
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy this commit's image on the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes ubuntu@57.129.162.57 "${{ github.sha }}"

      - name: Check the live site
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://stingdev.pro/api/v1/health/) || true
            [ "$code" = 200 ] && { echo "stingdev.pro healthy"; exit 0; }
            sleep 5
          done
          echo "stingdev.pro health: $code" && exit 1
