# يبني صورة الموقع في GitHub (لا على الخادم ولا بدقائق Render) ويدفعها إلى
# GHCR، ثم — إن فُعِّل — ينشرها على الخادم الخاص بسحب الصورة فقط.
#
# النشر الآلي معطّل حتى تُضبط في إعدادات المستودع:
#   Variables: VPS_DEPLOY=true
#   Secrets:   VPS_SSH_KEY (مفتاح خاص بالنشر فقط)، VPS_KNOWN_HOSTS (ssh-keyscan 57.129.162.57)
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/stingcompiler/nex-systems-portfolio-os

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # طبقات pip وnpm لا تُعاد إلا إن تغيّرت ملفات المتطلبات
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull and restart on the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy ubuntu@57.129.162.57 '
            set -e
            cd /srv/apps/stingdev
            git pull --ff-only
            cd deploy/vps
            sudo docker compose pull app worker
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f
          '
