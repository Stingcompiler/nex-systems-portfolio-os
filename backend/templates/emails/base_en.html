<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f8fafc;font-family:Inter,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e2e8f0;">
            <tr>
              <td style="background-color:#0f172a;padding:24px;text-align:center;">
                <span style="color:#ffffff;font-size:20px;font-weight:700;">{{ site_name }}</span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 28px;color:#0f172a;font-size:16px;line-height:1.65;text-align:left;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:20px 28px;background-color:#f1f5f9;color:#64748b;font-size:13px;line-height:1.6;text-align:left;">
                {% block footer %}
                If you did not request this email, you can safely ignore it.
                {% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
