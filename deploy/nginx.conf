# ─────────────────────────────────────────────────────────────
# stingdev — إعداد Nginx للإنتاج
#
# مبدأ الأصل الواحد: نطاق واحد يوزّع على الواجهة والـ API ولوحة الإدارة.
# لا CORS، والكوكيز HttpOnly تعمل بـ SameSite=Lax.
#
# استبدل stingdev.com بنطاقك، وشغّل certbot لإصدار الشهادة.
# ─────────────────────────────────────────────────────────────

upstream stingdev_web { server 127.0.0.1:3000; }
upstream stingdev_api { server 127.0.0.1:8000; }

# إعادة توجيه HTTP إلى HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name stingdev.com www.stingdev.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stingdev.com www.stingdev.com;

    ssl_certificate     /etc/letsencrypt/live/stingdev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stingdev.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ترويسات أمنية
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/xml;
    gzip_min_length 1024;

    # ─── الـ API إلى Django/Gunicorn
    location /api/ {
        proxy_pass http://stingdev_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── لوحة إدارة Django
    location /admin/ {
        proxy_pass http://stingdev_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── ملفات Django الثابتة والوسائط (يقدّمها Nginx مباشرة)
    location /static/ {
        alias /srv/stingdev/backend/staticfiles/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /srv/stingdev/backend/media/;
        expires 7d;
        access_log off;
        # منع تنفيذ أي سكربت من مجلد الوسائط
        location ~* \.(php|py|pl|sh|cgi)$ { deny all; }
    }

    # ─── كل ما تبقّى إلى واجهة Next.js
    location / {
        proxy_pass http://stingdev_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
