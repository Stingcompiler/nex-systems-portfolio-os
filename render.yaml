# توثيق طوبولوجيا النشر على Render — خدمة واحدة + Cron Job.
#
# ليس Blueprint مُطبَّقًا: الخدمة القائمة أُنشئت يدويًا من نوع Docker ولا
# يُغيَّر نوعها. الملف مرجع لما يجب أن تكون عليه الإعدادات في اللوحة.
#
# لماذا خدمة واحدة رغم ضيق 512MB: الكلفة. خدمتان ($14) تعطيان هامشًا
# أوسع، لكن هذا الإعداد يبقي الفاتورة عند ~$8 بثلاثة تنازلات مقاسة:
#   - كومة Node 128MB بدل 224 (185MB RSS بدل 250 بعد 45 صفحة، بلا أخطاء)
#   - لا تحسين صور في Next (Django يولّد WebP أصلًا) — يزيل ذروات sharp
#   - عامل المهام Cron كل 5 دقائق بدل عملية دائمة (~70MB) — بريد التحقق
#     قد يتأخر حتى 5 دقائق
# المجموع المقيس ~310MB بدل ~445MB، أي هامش ~200MB بدل الصفر.

services:
  - type: web
    name: nex-systems-portfolio-os-1
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: NODE_HEAP_MB
        value: "128"
      - key: WEB_CONCURRENCY
        value: "1"
      # بقية المتغيرات (SECRET_KEY, DB_*, ALLOWED_HOSTS, FRONTEND_URL,
      # REVALIDATE_SECRET, COOKIE_*, EMAIL_*) كما هي في الخدمة القائمة

  # عامل المهام: يُنشأ يدويًا New → Cron Job، بنفس متغيرات البيئة
  # (يفضَّل Environment Group مشترك مع الخدمة أعلاه)
  - type: cron
    name: nexa-queue
    runtime: python
    plan: 0.5c-512mb
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements/prod.txt
    startCommand: python manage.py process_queue
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: Q_WORKERS
        value: "1"
